[dependencies.base64ct]
version = "1.6.0"
features = ["std"]
optional = true

[dependencies.bincode]
version = "2.0.0-rc.3"
features = ["serde"]
optional = true

[dependencies.console_error_panic_hook]
version = "0.1"

[dependencies.futures]
version = "0.3"
features = ["std"]
default-features = false

[dependencies.gloo]
version = "0.11"
default-features = false
features = ["utils", "console"]

[dependencies.html-escape]
version = "0.2.13"
optional = true

[dependencies.implicit-clone]
version = "0.6.0"
features = ["map"]

[dependencies.indexmap]
version = "2.13"
features = ["std"]

[dependencies.js-sys]
version = "0.3"

[dependencies.rustversion]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.slab]
version = "0.4"

[dependencies.thiserror]
version = "2.0"

[dependencies.tokise]
version = "0.2.0"

[dependencies.tracing]
version = "0.1.44"

[dependencies.wasm-bindgen]
version = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "AnimationEvent",
    "Document",
    "DragEvent",
    "Element",
    "ErrorEvent",
    "Event",
    "EventInit",
    "EventTarget",
    "FocusEvent",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCollection",
    "HtmlTextAreaElement",
    "InputEvent",
    "InputEventInit",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Node",
    "NodeList",
    "PointerEvent",
    "ProgressEvent",
    "ShadowRoot",
    "Text",
    "TouchEvent",
    "TransitionEvent",
    "UiEvent",
    "WheelEvent",
    "Window",
    "HtmlScriptElement",
    "SubmitEvent",
