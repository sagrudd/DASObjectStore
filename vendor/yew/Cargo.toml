[package]
edition = "2021"
rust-version = "1.84.0"
name = "yew"
version = "0.23.0"
authors = [
    "Denis Kolodin <deniskolodin@gmail.com>",
    "Justin Starry <justin@yew.rs>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A framework for creating reliable and efficient web applications"
homepage = "https://yew.rs"
documentation = "https://docs.rs/yew/"
readme = "README.md"
keywords = [
    "web",
    "webasm",
    "javascript",
]
categories = [
    "gui",
    "wasm",
    "web-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yewstack/yew"
resolver = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "documenting",
]

[features]
csr = []
default = []
hydration = [
    "csr",
    "dep:bincode",
]
not_browser_env = []
serde = ["implicit-clone/serde"]
ssr = [
    "dep:html-escape",
    "dep:base64ct",
    "dep:bincode",
]
test = []

[lib]
name = "yew"
path = "src/lib.rs"

