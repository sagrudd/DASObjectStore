[dependencies.yew-macro]
version = "^0.23.0"

[dev-dependencies.gloo]
version = "0.11"
default-features = false
features = ["timers", "events", "file", "dialogs", "storage", "render", "console", "utils", "history", "net"]

[dev-dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[dev-dependencies.gloo-file]
version = "0.3"
features = ["futures"]

[dev-dependencies.trybuild]
version = "1"

[dev-dependencies.wasm-bindgen-futures]
version = "0.4"

[dev-dependencies.wasm-bindgen-test]
version = "0.3"

[dev-dependencies.web-sys]
version = "0.3"
features = [
    "ShadowRootInit",
    "ShadowRootMode",
    "HtmlButtonElement",
]

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies.tokio]
version = "1.49.0"
features = [
    "macros",
    "rt",
    "time",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.49.0"
features = ["rt"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1.49.0"
features = [
    "rt",
    "rt-multi-thread",
    "macros",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[lints.rust.unexpected_cfgs]
