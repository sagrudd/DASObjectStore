[workspace]
exclude = ["vendor", "vendor/yew", "vendor/yew-macro", "vendor/tokise"]
members = [
    "crates/dasobjectstore-cli",
    "crates/dasobjectstore-core",
    "crates/dasobjectstore-daemon",
    "crates/dasobjectstore-gui-api",
    "crates/dasobjectstore-gui-web",
    "crates/dasobjectstore-metadata",
    "crates/dasobjectstore-mnemosyne",
    "crates/dasobjectstore-object-service",
    "crates/dasobjectstore-platform",
    "crates/dasobjectstore-reference",
    "crates/dasobjectstore-remote",
    "crates/dasobjectstore-tui",
    "crates/dasobjectstore-workspace-host",
]
resolver = "2"

[workspace.package]
version = "0.188.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/sagrudd/DASObjectStore"

[workspace.dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
ed25519-dalek = { version = "2.2", default-features = false }
bytes = "1.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
dasobjectstore-core = { path = "crates/dasobjectstore-core", version = "=0.188.0"}
dasobjectstore-daemon = { path = "crates/dasobjectstore-daemon", version = "=0.188.0"}
dasobjectstore-gui-api = { path = "crates/dasobjectstore-gui-api", version = "=0.188.0"}
dasobjectstore-gui-web = { path = "crates/dasobjectstore-gui-web", version = "=0.188.0"}
dasobjectstore-metadata = { path = "crates/dasobjectstore-metadata", version = "=0.188.0"}
dasobjectstore-mnemosyne = { path = "crates/dasobjectstore-mnemosyne", version = "=0.188.0"}
dasobjectstore-object-service = { path = "crates/dasobjectstore-object-service", version = "=0.188.0"}
dasobjectstore-platform = { path = "crates/dasobjectstore-platform", version = "=0.188.0"}
dasobjectstore-reference = { path = "crates/dasobjectstore-reference", version = "=0.188.0"}
dasobjectstore-remote = { path = "crates/dasobjectstore-remote", version = "=0.188.0"}
dasobjectstore-tui = { path = "crates/dasobjectstore-tui", version = "=0.188.0"}
dasobjectstore-workspace-host = { path = "crates/dasobjectstore-workspace-host", version = "=0.188.0"}
gloo-net = "0.5.0"
gloo-timers = "0.3.0"
flate2 = "1.1.5"
hex = "0.4"
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.83"
plist = "1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
proxenos = { version = "=0.65.0", git = "https://github.com/sagrudd/proxenos.git", rev = "ae595ea6ca27ab312ea41fe206d2244bc5273707" }
coset = "0.3.8"
pistis-canonical = { git = "https://github.com/sagrudd/pistis.git", rev = "ef00ff34efbb9cfeac9298c9c77f1dc9694162cd", version = "=0.1.1" }
prosopikon-core = { version = "=0.39.0", git = "https://github.com/sagrudd/prosopikon.git", rev = "d13523430fbc7443bd73490207d33ac884c17972" }
prosopikon-yew = { version = "=0.4.0", git = "https://github.com/sagrudd/prosopikon.git", rev = "d13523430fbc7443bd73490207d33ac884c17972" }
rcgen = "0.14.8"
rand_core = { version = "0.6.4", features = ["getrandom"] }
ratatui = "0.30.2"
regex = "1.12.2"
libc = "0.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustls = "0.23.42"
tokio-rustls = "0.26.4"
ring = "0.17.14"
rusqlite = { version = "=0.39.0", features = ["fallible_uint", "bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
tar = "0.4.44"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.17", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.82"
x509-parser = "0.18.0"
yew = { version = "0.23.0", features = ["csr"] }

[patch.crates-io]
yew = { path = "vendor/yew" }
yew-macro = { path = "vendor/yew-macro" }
tokise = { path = "vendor/tokise" }
