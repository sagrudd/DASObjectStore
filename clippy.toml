# DASObjectStore has explicit, compatibility-sensitive daemon request and
# response boundaries. Keep Clippy strict for correctness/style lints while
# calibrating structural heuristics to those typed contracts. Production module
# growth is independently capped by tools/check-rust-module-size.sh.
too-many-arguments-threshold = 12
type-complexity-threshold = 500
enum-variant-size-threshold = 1024
large-error-threshold = 1024
